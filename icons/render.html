<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .icon {
    width: 100vw; height: 100vh;
    background: #1b2c3b;
    display: grid; place-items: center;
    font-family: 'Times New Roman', Times, 'Nimbus Roman', 'Liberation Serif', serif;
    color: #f3f0e8;
    /* 56% of the box: inside the circle Android crops a maskable icon to. */
    font-size: 64vmin;
    line-height: 1;
  }
  .icon span { display: block; transform: translate(2%, 3%); }
</style></head>
<body><div class="icon"><span>C</span></div></body></html>
