<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chapter — reading tracker</title>
    <meta name="description" content="Chapter is a reading tracker: catalogue your books, plan them onto a calendar, and see what today asks of you." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1b2c3b" />

    <!-- Everything below is relative, so the app works served from a
         subdirectory (`example.com/chapter/`) as readily as from a root. -->
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chapter" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/covers.css" />
    <link rel="stylesheet" href="css/library.css" />
    <link rel="stylesheet" href="css/calendar.css" />
    <link rel="stylesheet" href="css/dayview.css" />
    <link rel="stylesheet" href="css/sessions.css" />
    <link rel="stylesheet" href="css/stats.css" />
    <link rel="stylesheet" href="css/settings.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-head chrome">
        <div class="app-head__inner">
          <h1 class="wordmark">Chapter<span>Reading log</span></h1>
          <p class="save-status" id="save-status" aria-live="polite"></p>
          <nav class="app-nav" aria-label="Views">
            <button class="app-nav__link" data-route="calendar" onclick="location.hash='#/calendar'">
              Calendar
            </button>
            <button class="app-nav__link" data-route="day" onclick="location.hash='#/day'">
              Day
            </button>
            <button class="app-nav__link" data-route="year" onclick="location.hash='#/year'">
              Year
            </button>
            <button class="app-nav__link" data-route="library" onclick="location.hash='#/library'">
              Library
            </button>
            <button class="app-nav__link" data-route="orders" onclick="location.hash='#/orders'">
              Orders
            </button>
            <button class="app-nav__link" data-route="stats" onclick="location.hash='#/stats'">
              Stats
            </button>
            <button class="app-nav__link" data-route="settings" onclick="location.hash='#/settings'">
              Settings
            </button>
          </nav>
        </div>
      </header>

      <main class="app-main" id="view"></main>
    </div>

    <!-- One small live region, rather than a live region wrapped around the
         whole app: `aria-live` on #view meant every store change — a ticked
         checkbox, a logged sitting, a keystroke in the search field — read the
         entire page aloud from the top. -->
    <p class="visually-hidden" id="announcer" role="status" aria-live="polite"></p>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
